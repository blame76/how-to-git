name: GitHub Pages – manuelle Veröffentlichung
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests und Inhalt prüfen
        run: npm run check
      - name: Release-Gate und statische Website bauen
        run: npm run build:pages
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Statische Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Pages-Artifact veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
